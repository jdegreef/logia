name: IndexNow

# After a push to main, Render deploys once CI passes. This waits for the
# live site to serve the new build, then tells IndexNow (Bing, Yandex,
# Seznam, Naver) which pages changed (scripts/indexnow.py).
on:
  push:
    branches: [main]

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The live manifest, before the deploy
        run: python3 scripts/indexnow.py snapshot old.json
      - name: Wait for the deploy and send the pages that changed
        run: python3 scripts/indexnow.py submit old.json
