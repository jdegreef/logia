name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: pipx run ruff==0.16.9 check .
      - name: Check loci and citations are up to date
        run: python3 scripts/find_refs.py --check
      - name: Check whole texts are up to date
        run: python3 scripts/extract_texts.py --check
      - name: Check the page scripts parse
        run: node --check web/site.js && node --check web/reader.js && node --check web/account.js && node --check web/logia.js
      - name: Validate the library
        run: python3 scripts/validate.py
      - name: Check every excerpt against its source
        run: python3 scripts/verify_sources.py
      - name: Tests
        run: python3 -m unittest discover -s tests -t .
      - name: Build the site
        run: python3 scripts/build_site.py
