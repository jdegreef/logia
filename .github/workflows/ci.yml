name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: pipx run ruff==0.16.9 check .
      - name: Check loci and citations are up to date
        run: python3 scripts/find_refs.py --check
      - name: Check whole texts are up to date
        run: python3 scripts/extract_texts.py --check
      - name: Check the reference finders' scores are recorded
        run: python3 scripts/score_refs.py --check
      - name: Check creeds and confessions are up to date
        run: python3 scripts/extract_creeds.py --check
      - name: Check the scan pages name excerpts the library holds
        run: python3 scripts/find_pages.py --check
      - name: Check the page scripts parse
        run: node --check web/site.js && node --check web/reader.js && node --check web/account.js && node --check web/logia.js && node --check web/sw.js && node --check web/linker.js && node --check web/sheets.js
      - name: Validate the library
        run: python3 scripts/validate.py
      - name: Check every excerpt against its source
        run: python3 scripts/verify_sources.py
      - name: Install Pagefind, which indexes the words for /search/
        run: python3 -m pip install --quiet 'pagefind[bin]==1.5.2' 'pagefind-bin==1.5.2'
      - name: Build the site
        run: python3 scripts/build_site.py
      - name: Tests
        run: python3 -m unittest discover -s tests -t .
        env:
          LOGIA_SITE_BUILT: "1"
      - name: Check every link and #fragment inside the site
        run: python3 scripts/check_links.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the accessibility checker
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: Accessibility audit (axe, every colour theme)
        run: node scripts/a11y_audit.js
