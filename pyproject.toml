[project]
name = "logia"
version = "0.1.0"
description = "Logia (logia.faith): Scripture beside two thousand years of public-domain commentary."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
# scripts/extract/: one-off extraction scripts kept as run, as a record (see its README)
extend-exclude = ["site", "vendor", "scripts/extract"]

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, bugbear.
select = ["E", "W", "F", "B"]
ignore = [
    "B905",  # zip() without strict=: adding it changes behaviour, so case by case
]

[tool.ruff.lint.per-file-ignores]
# Page markup is kept on whole lines.
"scripts/build_site.py" = ["E501"]
"scripts/build_more.py" = ["E501"]
