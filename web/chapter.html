<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Hanken+Grotesk:wght@400..700&display=swap">
<style>
/* Layout: the passage (Open Word Bible text) reads on the left;
   the connections panel sits beside it (stacked below on phones), with a
   rail placing every voice on a line of centuries. Tokens follow the Open
   Word Bible reader: Paper and Lamplight, indigo with gold. */
:root {
  --bg: #faf6ef;
  --surface: #ffffff;
  --surface-2: #f4eee3;
  --text: #221c15;
  --muted: #6e6358;
  --line: #e8dfcf;
  --line-strong: #968462;
  --accent: #3f3d9a;
  --accent-contrast: #ffffff;
  --accent-soft: #ecebf7;
  --accent-soft-border: #d9d7f0;
  --gold: #b07d22;
  --mark: #f8e6b8;
  --shadow-card: 0 6px 20px -12px rgb(90 70 40 / .35);
  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --serif: "Gentium Book Plus", Georgia, "Times New Roman", serif;
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #16130f; --surface: #201b15; --surface-2: #2a241c; --text: #ece3d4;
    --muted: #ab9f8b; --line: #2d261d; --line-strong: #7c7060; --accent: #9c9af2;
    --accent-contrast: #16130f; --accent-soft: #221f33; --accent-soft-border: #36324f;
    --gold: #e0b45c; --mark: #4a3d16; --shadow-card: 0 6px 20px -12px rgb(0 0 0 / .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #16130f; --surface: #201b15; --surface-2: #2a241c; --text: #ece3d4;
  --muted: #ab9f8b; --line: #2d261d; --line-strong: #7c7060; --accent: #9c9af2;
  --accent-contrast: #16130f; --accent-soft: #221f33; --accent-soft-border: #36324f;
  --gold: #e0b45c; --mark: #4a3d16; --shadow-card: 0 6px 20px -12px rgb(0 0 0 / .55);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: .01em; }
.brand { color: var(--text); text-decoration: none; }
.proto { font-size: 12.5px; color: var(--muted); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 40px; margin-top: 28px; align-items: start; }
@media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 28px; } }

/* Passage */
.passage { min-width: 0; max-width: 40rem; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 4vw, 38px); line-height: 1.1; margin: 6px 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 18px; }
.levels { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); margin-bottom: 22px; }
.levels button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; cursor: pointer; font-size: 13.5px; color: var(--muted); }
.levels button[aria-pressed="true"] { background: var(--accent); color: var(--accent-contrast); }
.text { font-family: var(--serif); font-size: 20px; line-height: 1.75; }
.text h2 { font-family: var(--display); font-size: 17px; font-weight: 600; margin: 0 0 8px; color: var(--muted); }
.verse { cursor: pointer; border-radius: 5px; padding: 2px 1px; transition: background-color 150ms; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.verse:hover { background: var(--surface-2); }
.verse.on { background: var(--mark); }
.vn { font-family: var(--sans); font-size: 11.5px; font-weight: 700; color: var(--gold); vertical-align: super; line-height: 0; margin: 0 3px 0 2px; }
.w { border-radius: 3px; }
.verse.on .w:hover, .w.on { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.w.on { background: var(--accent-soft); }
.hint { font-size: 13px; color: var(--muted); margin-top: 18px; }

/* Panel */
.panel { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-card); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
.grab { display: none; }
@media (max-width: 880px) {
  .passage { padding-bottom: 150px; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 5; max-height: 74vh; border-radius: 18px 18px 0 0; border-bottom: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
    box-shadow: 0 -10px 30px -12px rgb(0 0 0 / .35); transition: max-height 220ms ease; }
  .panel.min { max-height: 128px; overflow: hidden; }
  .panel.min .pb, .panel.min .rail, .panel.min .ph-text { display: none; }
  .grab { display: block; width: 100%; border: 0; background: none; padding: 8px 0 0; cursor: pointer; }
  .grab::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--line-strong); margin: 0 auto; }
  .ph { padding-top: 6px; }
  .ph h3 { font-size: 21px; }
}
@media (max-width: 880px) and (prefers-reduced-motion: reduce) { .panel { transition: none; } }
.ph { padding: 18px 20px 0; }
.ph-ref { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.ph h3 { font-family: var(--display); font-size: 24px; font-weight: 600; margin: 0; }
.nav { display: flex; gap: 4px; }
.nav button { border: 1px solid var(--line); background: var(--bg); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }
.nav button:disabled { opacity: .35; cursor: default; }
.ph-text { font-family: var(--serif); font-size: 16px; color: var(--muted); margin: 6px 0 14px; }
.summary { font-size: 13px; color: var(--muted); }

.rail { position: relative; height: 54px; margin: 8px 6px 4px; }
.rail-line { position: absolute; left: 0; right: 0; top: 22px; height: 1px; background: var(--line-strong); }
.tick { position: absolute; top: 28px; font-size: 10.5px; color: var(--muted); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.tick::before { content: ""; position: absolute; left: 50%; top: -9px; width: 1px; height: 5px; background: var(--line-strong); }
.dot { position: absolute; top: 15px; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%; border: 2px solid var(--surface); background: var(--gold); cursor: pointer; padding: 0; }
.dot.off { background: var(--line-strong); opacity: .45; }
.dot:hover::after, .dot:focus-visible::after { content: attr(data-name); position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--text); color: var(--bg); font-size: 11.5px; padding: 2px 7px; border-radius: 5px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 10px 12px 9px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs .n { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 3px; font-variant-numeric: tabular-nums; }

.pb { padding: 16px 20px 22px; overflow-y: auto; min-height: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-soft-border); color: var(--accent); font-weight: 600; }

.era { margin: 18px 0 8px; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--gold); display: flex; align-items: center; gap: 10px; }
.era::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.era:first-child { margin-top: 0; }
.card { padding: 14px 0 16px; border-bottom: 1px solid var(--line); scroll-margin-top: 12px; }
.card:last-child { border-bottom: 0; }
.card.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--mark); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .card.flash { animation: none; } }
.who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.who b { font-family: var(--display); font-size: 17px; font-weight: 600; }
.who .d { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }
.work { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
.work i { color: var(--text); }
.range { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
.lemma { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); margin-bottom: 4px; }
.ex { font-family: var(--serif); font-size: 16.5px; line-height: 1.6; max-width: 65ch; }
.ex p { margin: 0 0 .7em; }
.ex .range, .ex .lemma { font-family: var(--sans); }
.ex .lemma { font-family: var(--serif); }
.ex p + .range, .ex p + .lemma { margin-top: 1em; }
.ex.clamp { max-height: 11.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.more { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; margin-top: 4px; }
.more button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
a.cite { color: inherit; text-decoration: underline dotted var(--accent); text-underline-offset: 3px; }
a.cite:hover { color: var(--accent); }
.qs { font-size: 13.5px; color: var(--muted); margin: 6px 0 12px; padding-left: 10px; border-left: 2px solid var(--line); }
.qs div + div { margin-top: 4px; }
.qs b { color: var(--text, inherit); font-weight: 600; }
.qs button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; font-weight: 600; }
.elsewhere { margin-top: 22px; }
.elsewhere .hint { margin: 2px 0 10px; }
.cb { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.cb .who { margin-bottom: 4px; }
.cb q { quotes: none; font-family: var(--serif); }
.cb mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
.cb button, .cb a.go { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 13px; }

/* Words */
.greek { font-family: var(--serif); font-size: 21px; line-height: 1.9; margin-bottom: 14px; }
.g { cursor: pointer; border-radius: 4px; padding: 0 2px; }
.g:hover { background: var(--surface-2); }
.g.on { background: var(--accent-soft); color: var(--accent); }
.word { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--bg); }
.word .big { font-family: var(--serif); font-size: 28px; }
.word dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 10px 0 0; font-size: 14px; }
.word dt { color: var(--muted); }
.word dd { margin: 0; }
.gk { font-family: var(--serif); }

/* Notes */
.src { font-family: var(--serif); font-size: 18px; line-height: 1.7; }
.gloss { font-size: 14px; color: var(--muted); margin: 4px 0 14px; }
.note { padding: 12px 0; border-top: 1px solid var(--line); }
.note h4 { margin: 0 0 4px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.note h4 .tag { font-weight: 500; }
.note p { margin: 4px 0 0; font-size: 14.5px; }
.alt { color: var(--muted); font-size: 13.5px; }
.xr { display: flex; flex-wrap: wrap; gap: 8px; }
.xr a { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; text-decoration: none; background: var(--bg); font-size: 14px; }
.foot { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); max-width: 72ch; }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">Logia</a>
    <div class="proto">{{PROTO}}</div>
  </header>

  <div class="layout">
    <article class="passage">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1>{{H1}}</h1>
      <p class="sub">Pick a verse to see what the church has said about it. In Balanced, tap a word for its Greek.</p>
      <div class="levels" role="group" aria-label="Translation level">
        <button id="lv-L" data-level="L" aria-pressed="false">Literal</button>
        <button id="lv-B" data-level="B" aria-pressed="true">Balanced</button>
        <button id="lv-R" data-level="R" aria-pressed="false">Readable</button>
      </div>
      <div class="text" id="text"></div>
      <p class="hint">Bible text: <a href="{{OWB_URL}}" target="_blank" rel="noopener">Open Word Bible</a> (CC0), English. An AI draft awaiting human review.</p>
    </article>

    <aside class="panel" id="panel" aria-live="polite">
      <button class="grab" id="grab" aria-label="Show or hide the commentary panel"></button>
      <div class="ph">
        <div class="ph-ref">
          <h3 id="ref">{{FIRST_REF}}</h3>
          <div class="nav">
            <button id="prev" aria-label="Previous verse">&#8249;</button>
            <button id="next" aria-label="Next verse">&#8250;</button>
          </div>
        </div>
        <div class="ph-text" id="ph-text"></div>
        <div class="summary" id="summary"></div>
        <div class="rail" id="rail" aria-label="Commentators on a line of centuries"></div>
        <div class="tabs" role="tablist">
          <button role="tab" id="tab-comm" data-tab="comm" aria-selected="true">Commentary<span class="n" id="n-comm"></span></button>
          <button role="tab" id="tab-words" data-tab="words" aria-selected="false">Greek words<span class="n" id="n-words"></span></button>
          <button role="tab" id="tab-notes" data-tab="notes" aria-selected="false">Translation notes<span class="n" id="n-notes"></span></button>
          <button role="tab" id="tab-xref" data-tab="xref" aria-selected="false">Cross-references<span class="n" id="n-xref"></span></button>
        </div>
      </div>
      <div class="pb" id="pb"></div>
    </aside>
  </div>

  <footer class="foot" id="foot"></footer>
</div>

<script>
const DATA = /*DATA*/null;
const ERAS = ["Early church", "Middle Ages", "Reformation", "Puritans and the 1700s", "The 1800s"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = { verse: 1, level: "B", tab: "comm", token: null, eras: new Set(ERAS) };
try { const l = localStorage.getItem("owbs-level"); if (l) state.level = l; } catch (e) {}

const works = DATA.commentaries.slice().sort((a, b) => ERAS.indexOf(a.era) - ERAS.indexOf(b.era) || year(a) - year(b));
function year(w) { const m = String(w.author_dates).match(/\d{3,4}/g); return m ? +m[m.length - 1] : 0; }
const recFor = v => DATA.records.find(r => r.verses.includes(v));
const FIRST = DATA.verses[0], LAST = DATA.verses[DATA.verses.length - 1];
const REF = v => `${DATA.bookName} ${DATA.chapter}:${v}`;
const entriesFor = (w, v) => w.entries.filter(e => e.start <= v && v <= e.end);
function verseText(v) {
  const r = recFor(v);
  if (state.level === "B") return r.pieces.filter(p => p[0] === v).map(p => p[1]).join("").trim();
  return r[state.level][v] || "";
}

function renderText() {
  const out = [];
  for (const r of DATA.records) {
    if (r.heading && r.verses[0] !== 1) out.push(`<h2>${esc(r.heading)}</h2>`);
    for (const v of r.verses) {
      let inner;
      if (state.level === "B") {
        inner = r.pieces.filter(p => p[0] === v).map(p => p[2]
          ? `<span class="w" data-tok="${p[2].join(" ")}">${esc(p[1])}</span>` : esc(p[1])).join("");
      } else inner = esc(r[state.level][v] || "");
      out.push(`<span class="verse${v === state.verse ? " on" : ""}" data-v="${v}" tabindex="0" role="button" aria-label="${REF(v)}"><span class="vn">${v}</span>${inner}</span> `);
    }
  }
  $("#text").innerHTML = out.join("");
  document.querySelectorAll(".levels button").forEach(b => b.setAttribute("aria-pressed", b.dataset.level === state.level));
  markTokens();
}
function markTokens() {
  document.querySelectorAll(".w").forEach(el => {
    el.classList.toggle("on", !!state.token && el.dataset.tok.split(" ").includes(state.token));
  });
}

function renderRail() {
  const lo = 200, hi = 1950, pos = y => ((y - lo) / (hi - lo)) * 100;
  let h = `<div class="rail-line"></div>`;
  for (const t of [300, 600, 900, 1200, 1500, 1800]) h += `<span class="tick" style="left:${pos(t)}%">${t}</span>`;
  let last = -99, lift = false;
  for (const w of works.slice().sort((a, b) => year(a) - year(b))) {
    const has = entriesFor(w, state.verse).length > 0 && state.eras.has(w.era);
    const x = pos(year(w)); lift = x - last < 2.5 ? !lift : false; last = x;
    h += `<button class="dot${has ? "" : " off"}" style="left:${x}%;${lift ? "top:1px" : ""}" data-work="${w.work_id}" data-name="${esc(w.author)}" aria-label="${esc(w.author)}"></button>`;
  }
  $("#rail").innerHTML = h;
}

function renderPanel() {
  const v = state.verse;
  $("#ref").textContent = REF(v);
  $("#ph-text").textContent = verseText(v);
  $("#prev").disabled = v === FIRST; $("#next").disabled = v === LAST;
  const voices = works.filter(w => entriesFor(w, v).length);
  const eras = new Set(voices.map(w => w.era));
  $("#summary").textContent = voices.length
    ? `${voices.length} voices from ${eras.size} ${eras.size === 1 ? "era" : "eras"}, ${voices[0].author.split(" ").slice(-1)} to ${voices[voices.length - 1].author.split(" ").slice(-1)}`
    : "No commentary on this verse yet";
  const r = recFor(v);
  $("#n-comm").textContent = voices.length;
  $("#n-words").textContent = DATA.greek[v].length;
  $("#n-notes").textContent = r.decisions.length;
  $("#n-xref").textContent = DATA.crossrefs[v].length;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  renderRail();
  $("#pb").innerHTML = ({ comm: commTab, words: wordsTab, notes: notesTab, xref: xrefTab })[state.tab]();
  $("#pb").scrollTop = 0;
}

function shortEd(w) {
  const m = String(w.edition).match(/^[^;(]+/); let s = (m ? m[0] : w.edition).trim().replace(/[,.]$/, "");
  return s.length > 90 ? s.slice(0, 88).replace(/\s+\S*$/, "") + "…" : s;
}
function paras(t) { return t.split(/\n\s*\n/).map(p => `<p>${p.trim()}</p>`).join(""); }
// An excerpt's text with the Scripture it cites made into links.
function linked(text, cites) {
  let h = "", pos = 0;
  for (const c of (cites || []).slice().sort((a, b) => a.at - b.at)) {
    if (c.at < pos) continue;
    const same = cites.filter(x => x.at === c.at).map(x => x.label).join(", ");
    const words = esc(text.slice(c.at, c.at + c.text.length));
    h += esc(text.slice(pos, c.at)) + (c.href
      ? `<a class="cite" href="${esc(c.href)}"${c.href.startsWith("/") ? "" : ` target="_blank" rel="noopener"`} title="${esc(same)}">${words}</a>`
      : `<span class="cite" title="${esc(same)}">${words}</span>`);
    pos = c.at + c.text.length;
  }
  return h + esc(text.slice(pos));
}
// Quotations of the Fathers, both ways: a catena's to the quoted passage,
// and a passage to the catena that quotes it.
const UNCHECKED = `<span title="Matched by shared wording; no one has checked it yet">(matched by wording, unchecked)</span>`;
function readIt(href, verse, work, on) {
  if (!href) return "";
  return href.startsWith(location.pathname) || href.startsWith("/" + DATA.book.toLowerCase() + "/" + DATA.chapter + "/")
    ? `<button data-goto="${verse}" data-work="${esc(work)}">read it on ${esc(on)}</button>`
    : `<a href="${esc(href)}">read it on ${esc(on)}</a>`;
}
function traced(e) {
  const rows = (e.quotes || []).map(q => `<div><b>${esc(q.label)}</b> ${esc(q.author)}, ${esc(q.where)}${q.exact ? "" : " (the passage is not pinned down)"}:
      ${q.excerpt ? readIt(q.href, q.verse, q.work_id, REF(q.verse)) + " · " : ""}<a href="${esc(q.url)}" target="_blank" rel="noopener">full text ↗</a> ${q.status === "reviewed" ? "" : UNCHECKED}</div>`)
    .concat((e.quotedIn || []).map(q => `<div>Quoted by ${esc(q.author)} in the <i>Catena Aurea</i> on ${esc(q.on)}:
      ${readIt(q.href, q.verse, q.work_id, q.on)} ${q.status === "reviewed" ? "" : UNCHECKED}</div>`));
  return rows.length ? `<div class="qs">${rows.join("")}</div>` : "";
}
function locusLabel(w, e) {
  if (!e.locus || !Array.isArray(w.divisions)) return "";
  return e.locus.split(".").map((n, i) => `${i ? w.divisions[i].toLowerCase() : w.divisions[i]} ${n}`).join(", ");
}
function commTab() {
  const v = state.verse;
  let h = `<div class="chips" role="group" aria-label="Show eras">` + ERAS.map(e =>
    `<button class="chip" data-era="${esc(e)}" aria-pressed="${state.eras.has(e)}">${esc(e)}</button>`).join("") + `</div>`;
  let any = false;
  for (const era of ERAS) {
    if (!state.eras.has(era)) continue;
    const ws = works.filter(w => w.era === era && entriesFor(w, v).length);
    if (!ws.length) continue;
    any = true;
    h += `<div class="era">${esc(era)}</div>`;
    for (const w of ws) {
      const es = entriesFor(w, v);
      const body = es.map(e => {
        const where = [e.start === e.end ? "" : `On verses ${e.start}–${e.end}`, locusLabel(w, e)].filter(Boolean).join(" · ");
        const range = where ? `<div class="range">${esc(where)}</div>` : "";
        const lemma = e.heading && !e.excerpt.replace(/^\s*\d+\.\s*/, "").toLowerCase().startsWith(e.heading.toLowerCase())
          ? `<div class="lemma">${esc(e.heading)}</div>` : "";
        return `${range}${lemma}${paras(linked(e.excerpt, e.cites))}${traced(e)}`;
      }).join("");
      const words = es.reduce((n, e) => n + e.excerpt.split(/\s+/).length, 0);
      const long = words > 140;
      h += `<section class="card" id="c-${w.work_id}">
        <div class="who"><b>${esc(w.author)}</b><span class="d">${esc(w.author_dates)}</span><span class="tag">${esc(w.tradition)}</span></div>
        <div class="work"><i>${esc(w.title)}</i> · ${esc(shortEd(w))}</div>
        <div class="ex${long ? " clamp" : ""}">${body}</div>
        <div class="more">${long ? `<button data-expand>Read all ${words.toLocaleString()} words</button>` : ""}${es[0].inFull ? `<a href="${esc(es[0].inFull)}">Read ${esc(locusLabel(w, { locus: es[0].locus.split(".")[0] }))} in full</a>` : ""}<a href="${esc(es[0].source_url)}" target="_blank" rel="noopener">Full text ↗</a></div>
      </section>`;
    }
  }
  if (!any) h += works.some(w => entriesFor(w, v).length)
    ? `<p class="empty">No commentary from the chosen eras on this verse. Turn an era back on above.</p>`
    : `<p class="empty">No commentary on this verse yet.</p>`;
  return h + elsewhere(v);
}
function elsewhere(v) {
  const rows = (DATA.citedBy[v] || []).filter(r => state.eras.has(r.era));
  if (!rows.length) return "";
  return `<section class="elsewhere"><div class="era">Elsewhere in the library</div>
    <p class="hint">Writing on other verses, these commentators refer to ${esc(REF(v))}.</p>` + rows.map(r => {
    const i = r.snippet.indexOf(r.text);
    const q = i < 0 ? esc(r.snippet) : esc(r.snippet.slice(0, i)) + `<mark>${esc(r.text)}</mark>` + esc(r.snippet.slice(i + r.text.length));
    const go = r.here ? `<button data-goto="${r.verse}" data-work="${esc(r.work_id)}">Read it on ${esc(r.on)}</button>`
      : `<a class="go" href="${esc(r.href)}">Read it on ${esc(r.on)}</a>`;
    return `<div class="cb"><div class="who"><b>${esc(r.author)}</b><span class="d">${esc(r.author_dates)}</span><span class="tag">${esc(r.tradition)}</span></div>
      <q>${q}</q><div>${go}</div></div>`;
  }).join("") + `</section>`;
}

function wordsTab() {
  const v = state.verse, toks = DATA.greek[v];
  let h = `<div class="greek" lang="grc">` + toks.map(t =>
    `<span class="g${t.id === state.token ? " on" : ""}" data-gid="${t.id}" role="button" tabindex="0">${esc(t.text)}</span>${esc((t.after || " ").replace(/(\S)$/, "$1 "))}`).join("") + `</div>`;
  const t = toks.find(x => x.id === state.token);
  if (!t) return h + `<p class="empty">Tap a Greek word above, or a word in the Balanced text, to see what it means and how it was translated.</p>`;
  h += `<div class="word"><div class="big gk" lang="grc">${esc(t.text)}</div>
    <dl><dt>Dictionary form</dt><dd class="gk" lang="grc">${esc(t.lemma)}</dd>
    <dt>Grammar</dt><dd>${esc(t.parse)}</dd>
    <dt>Gloss</dt><dd>${esc(t.gloss)}</dd>
    <dt>Strong's</dt><dd>G${esc(t.strong)}</dd></dl></div>`;
  const decs = recFor(v).decisions.filter(d => (d.tokens || []).includes(t.id));
  if (decs.length) h += `<div class="era" style="margin-top:18px">How the Open Word Bible translated it</div>` + decs.map(noteHtml).join("");
  return h;
}

const CAT = { allusion: "Allusion", word_sense: "Word sense", grammar: "Grammar", theology: "Theology", word_choice: "Word choice", punctuation: "Punctuation", textual: "Manuscripts", style: "Style", idiom: "Idiom", clarity: "Clarity" };
function noteHtml(d) {
  const kind = d.layer === "meaning" ? "Meaning" : `English ${(d.levels || []).map(l => ({L:"Literal",B:"Balanced",R:"Readable"})[l]).join(", ")}`;
  return `<div class="note"><h4>${esc(d.choice)} <span class="tag">${esc(CAT[d.category] || d.category)}</span><span class="tag">${esc(kind)}</span>${d.uncertain ? `<span class="tag">Uncertain</span>` : ""}</h4>
    ${d.alternatives && d.alternatives.length ? `<div class="alt">Not: ${d.alternatives.map(esc).join(" · ")}</div>` : ""}
    <p>${esc(d.reason)}</p></div>`;
}
function notesTab() {
  const r = recFor(state.verse);
  const span = r.verses.length > 1 ? `<div class="range">This sentence runs across verses ${r.verses[0]}–${r.verses[r.verses.length - 1]}</div>` : "";
  return `${span}<div class="src" lang="grc">${esc(r.greek)}</div><div class="gloss">Word for word: ${esc(r.gloss)}</div>` + r.decisions.map(noteHtml).join("");
}
function refLabel(ref) {
  const [b, c, v] = ref.split(".");
  return `${DATA.books[b] || b} ${c}${v ? ":" + v : ""}`;
}
function xrefTab() {
  const xs = DATA.crossrefs[state.verse];
  if (!xs.length) return `<p class="empty">No cross-references for this verse.</p>`;
  return `<div class="xr">` + xs.map(x => {
    const [b, c] = x.split(".");
    return `<a href="https://openwordbible.org/${b.toLowerCase()}/${c}/" target="_blank" rel="noopener">${esc(refLabel(x))}</a>`;
  }).join("") + `</div><p class="hint">Cross-references from OpenBible.info (CC BY), most voted first.</p>`;
}

function go(v, opts = {}) {
  state.verse = Math.max(FIRST, Math.min(LAST, v));
  if (!opts.keepToken) state.token = null;
  document.querySelectorAll(".verse").forEach(el => el.classList.toggle("on", +el.dataset.v === state.verse));
  markTokens();
  renderPanel();
  if (location.hash !== `#v${state.verse}`) history.replaceState(null, "", `#v${state.verse}`);
}

$("#text").addEventListener("click", e => {
  const w = e.target.closest(".w"), vs = e.target.closest(".verse");
  if (!vs) return;
  const v = +vs.dataset.v;
  if (w && v === state.verse) {
    const ids = w.dataset.tok.split(" ");
    state.token = ids[ids.length - 1];
    state.tab = "words";
    go(v, { keepToken: true });
    $("#panel").classList.remove("min");
    return;
  }
  go(v);
  $("#panel").classList.remove("min");
});
$("#text").addEventListener("keydown", e => {
  const vs = e.target.closest(".verse");
  if (vs && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); go(+vs.dataset.v); }
});
document.querySelector(".levels").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.level = b.dataset.level; state.token = null;
  try { localStorage.setItem("owbs-level", state.level); } catch (err) {}
  renderText(); renderPanel();
});
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.tab = b.dataset.tab; renderPanel();
});
$("#grab").onclick = () => $("#panel").classList.toggle("min");
if (window.innerWidth <= 880 && !location.hash) $("#panel").classList.add("min");
$("#prev").onclick = () => go(state.verse - 1);
$("#next").onclick = () => go(state.verse + 1);
$("#pb").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) {
    const era = chip.dataset.era;
    if (state.eras.has(era)) state.eras.delete(era); else state.eras.add(era);
    renderPanel(); return;
  }
  const to = e.target.closest("[data-goto]");
  if (to) {
    state.tab = "comm"; go(+to.dataset.goto);
    const card = document.getElementById("c-" + to.dataset.work);
    if (card) { card.scrollIntoView({ behavior: "smooth", block: "start" }); card.classList.add("flash"); }
    return;
  }
  const ex = e.target.closest("[data-expand]");
  if (ex) { ex.closest(".card").querySelector(".ex").classList.remove("clamp"); ex.remove(); return; }
  const g = e.target.closest(".g");
  if (g) { state.token = g.dataset.gid; markTokens(); renderPanel(); }
});
$("#pb").addEventListener("keydown", e => {
  const g = e.target.closest(".g");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); state.token = g.dataset.gid; markTokens(); renderPanel(); }
});
$("#rail").addEventListener("click", e => {
  const d = e.target.closest(".dot"); if (!d || d.classList.contains("off")) return;
  if (state.tab !== "comm") { state.tab = "comm"; renderPanel(); }
  const card = document.getElementById("c-" + d.dataset.work);
  if (card) { card.scrollIntoView({ behavior: "smooth", block: "start" }); card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash"); }
});
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#v(\d+)$/); if (m && +m[1] !== state.verse) go(+m[1]); });

$("#foot").innerHTML = `Commentary excerpts are copied word for word from public-domain editions and link to the full text: ` +
  works.map(w => `${esc(w.author)}, <a href="${esc(w.full_text_url)}" target="_blank" rel="noopener"><i>${esc(w.title)}</i></a> (${esc(w.edition)})`).join("; ") +
  `. The Catena Aurea, Bengel, Ryle and Westcott come from page scans on archive.org: misread letters and figures have been corrected to match the printed page, and Greek that the scans cannot read is left out (marked … where it breaks a sentence). Scripture references in the excerpts are linked: in the CCEL transcriptions as CCEL's editors marked them, in the scans where they are printed in the usual way; no one has checked these links yet. Greek text: SBLGNT with MACULA Greek word data (CC BY 4.0). Translation: Open Word Bible (CC0).`;

const m0 = location.hash.match(/^#v(\d+)$/);
if (m0) state.verse = Math.max(FIRST, Math.min(LAST, +m0[1]));
renderText(); go(state.verse);
</script>
</body>
</html>
