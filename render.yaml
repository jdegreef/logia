# Render Blueprint for Logia (logia.faith): create it with New > Blueprint and
# this repository, then point logia.faith's DNS at it (docs/deploy.md). The
# site is static, built from this repository; its one dependency is Pagefind,
# which indexes the excerpts' words for /search/ (pinned here and in CI; the
# build still works without it, with no word search).
services:
  - type: web
    name: logia
    runtime: static
    # The About page's "Recently added" reads when each work was first
    # committed, so the build needs the whole history, not a shallow clone.
    buildCommand: (git fetch --unshallow --quiet || true) && (python3 -m pip install --quiet --user 'pagefind[bin]==1.5.2' 'pagefind-bin==1.5.2' || echo "Pagefind not installed: no word search in this build") && python3 scripts/build_site.py
    staticPublishPath: site
    pullRequestPreviewsEnabled: true
    # Deploy main only once CI (.github/workflows/ci.yml) passes.
    autoDeployTrigger: checksPass
    # Render adds www.logia.faith itself and redirects it to the root.
    domains:
      - logia.faith
    # Serve only at logia.faith: the onrender.com address returns 404.
    renderSubdomainPolicy: disabled
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Files whose address carries their digest (?v=..., asset() and
      # digest_url() in scripts/build_site.py) never change at that address,
      # so browsers may keep them a year. The fonts keep their names when
      # refreshed from the Open Word Bible, so they are kept a month. Pages
      # themselves are checked on every visit (Render's default).
      # The service worker is checked on every visit, so a new build reaches
      # readers at once (web/sw.js).
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /panel/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /comm/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /style.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /logia.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /site.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /account.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /reader.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /logia.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sheets.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /study.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /review.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The linker (web/linker.js) runs on other sites, so it and its chapter
      # files may be read from any origin. Their addresses carry no digest,
      # so browsers keep them a day.
      - path: /linker.js
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /linker.js
        name: Cache-Control
        value: public, max-age=86400
      - path: /linker/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /linker/*
        name: Cache-Control
        value: public, max-age=86400
      # The API (scripts/api.py, docs/api.md) is for other sites and
      # programs, so any origin may read it; it changes with each build.
      - path: /api/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /api/*
        name: Cache-Control
        value: public, max-age=3600
      # The parish widget (web/widget.js, /widget/) runs on church sites, so
      # it and its Sundays may be read from any origin; they change weekly.
      - path: /widget.js
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /widget.js
        name: Cache-Control
        value: public, max-age=86400
      - path: /widget/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /widget/*
        name: Cache-Control
        value: public, max-age=3600
