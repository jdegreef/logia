<div xmlns="http://www.w3.org/1999/xhtml" class="book-content"> <p class="c35" id="xv.iii.i.xxi-p1" shownumber="no"> <span class="c2" id="xv.iii.i.xxi-p1.1">21.  (6) of Design and Execution.</span></p> <p class="c12" id="xv.iii.i.xxi-p2" shownumber="no">Again we speak of the arche of an action, in which there is a design which appears after the beginning.  It may be considered whether wisdom is to be regarded as the arche of the works of God because it is in this way the principle of them. </p> </div>
