<div xmlns="http://www.w3.org/1999/xhtml" class="book-content"><a name="ix-p0.1"></a><p class="BOOK-CHAP-BLU-24-CEN18" id="ix-p1">PSALM 100</p> <p id="ix-p2">The title of this psalm may serve for a summary of its contents Moreover, its brevity renders a lengthened discourse unnecessary. The Psalmist, in an especial manner, invites believers to praise God, because he has chosen them to be his people, and has taken them under his care. </p> </div>
