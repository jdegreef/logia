<div xmlns="http://www.w3.org/1999/xhtml" class="book-content"><a name="xxi-p0.1"></a><p class="BOOK-CHAP-BLU-24-CEN21" id="xxi-p1" shownumber="no">PSALM 15.</p> <p id="xxi-p2" shownumber="no">This psalm teaches us upon what condition God made choice of the Jews to be his people, and placed his sanctuary in the midst of them. This condition was, that they should show themselves to be a peculiar and holy people, by leading a just and upright life. </p> <p class="PoetryLast-DkBlu-11-Cent28" id="xxi-p3" shownumber="no">A Song of David.</p> </div>
