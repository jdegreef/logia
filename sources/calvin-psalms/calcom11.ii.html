<div xmlns="http://www.w3.org/1999/xhtml" class="book-content"><a name="ii-p0.1"></a><p class="BOOK-CHAP-BLU-24-CEN18" id="ii-p1">PSALM 93</p> <p id="ii-p2">The psalm commences with the celebration of the infinite glory of God. It is then declared that such is his faithfulness that he never deceives his own people, who, embracing his promises, wait with tranquil minds for their salvation amidst all the tempests and agitations of the world. </p> </div>
