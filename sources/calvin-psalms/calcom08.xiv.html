<div xmlns="http://www.w3.org/1999/xhtml" class="book-content"><a name="xiv-p0.1"></a><p class="BOOK-CHAP-BLU-24-CEN21" id="xiv-p1" shownumber="no">PSALM 8.</p> <p id="xiv-p2" shownumber="no">David, reflecting upon God’s fatherly beneficence towards mankind, is not content with simply giving thanks for it, but is enraptured by the contemplation of it. </p> <p class="PoetryLast-DkBlu-11-Cent28" id="xiv-p3" shownumber="no">To the chief musician upon Hagittith. A song of David.</p> </div>
