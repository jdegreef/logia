<div xmlns="http://www.w3.org/1999/xhtml" class="book-content"><a name="xi-p0.1"></a><p class="BOOK-CHAP-BLU-24-CEN15" id="xi-p1" shownumber="no">PSALM 127</p> <p id="xi-p2" shownumber="no">This Psalm shows that the order of society, both political and domestic, is maintained solely by the blessing of God, and not by the policy, diligence, or wisdom of men; and that the procreating of children is his peculiar gift. </p> <p class="PoetryLast-DkBlu-11-Cent26" id="xi-p3" shownumber="no">A Song of Degrees of Solomon.</p> </div>
