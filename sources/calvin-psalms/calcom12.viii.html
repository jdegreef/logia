<div xmlns="http://www.w3.org/1999/xhtml" class="book-content"><a name="viii-p0.1"></a><p class="BOOK-CHAP-BLU-24-CEN15" id="viii-p1" shownumber="no">PSALM 124</p> <p id="viii-p2" shownumber="no">The Church having been providentially delivered from extreme peril, David exhorts true believers to thanksgiving, and teaches them by this memorable example, that their safety depends solely upon the grace and power of God. </p> <p class="PoetryLast-DkBlu-11-Cent26" id="viii-p3" shownumber="no">A Song of Degrees of David.</p> </div>
