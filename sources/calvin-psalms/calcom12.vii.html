<div xmlns="http://www.w3.org/1999/xhtml" class="book-content"><a name="vii-p0.1"></a><p class="BOOK-CHAP-BLU-24-CEN15" id="vii-p1" shownumber="no">PSALM 123</p> <p id="vii-p2" shownumber="no">In this Psalm, the faithful oppressed with the cruel tyranny of their enemies, beseech God to deliver them, there being no other source of hope left for them except in his protection. </p> <p class="PoetryLast-DkBlu-11-Cent26" id="vii-p3" shownumber="no">A Song of Degrees.</p> </div>
