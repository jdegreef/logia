<div xmlns="http://www.w3.org/1999/xhtml" class="book-content"><a name="x.xix.cxlii-p0.1"></a><p class="Center" id="x.xix.cxlii-p1">PSALM 141</p><a name="x.xix.cxlii-p1.1"></a><div class="Commentary" id="x.xix.cxlii-p1.2"> <p id="x.xix.cxlii-p2"><a class="scripRef" id="x.xix.cxlii-p2.1" href="/ccel/bible/asv.Ps.141.html#Ps.141.1" onclick="return goBible('ot','Ps','141','1','141','10');" onmouseover="popupVerse(this, 'Ps 141:1 - 141:10')" onmouseout="leaveVerse()" name="_Ps_141_1_141_10">Ps 141:1-10</a>. This Psalm evinces its authorship as the preceding, by its structure and the character of its contents. It is a prayer for deliverance from sins to which affliction tempted him, and from the enemies who caused it. </p> <a name="x.xix.cxlii-p2.2"></a> </div> <div class="Commentary" id="x.xix.cxlii-p2.3"> <a name="x.xix.cxlii-p2.4"></a> </div> <div class="Commentary" id="x.xix.cxlii-p2.5"> <a name="x.xix.cxlii-p2.6"></a> </div> <div class="Commentary" id="x.xix.cxlii-p2.7"> <a name="x.xix.cxlii-p2.8"></a> </div> <div class="Commentary" id="x.xix.cxlii-p2.9"> <a name="x.xix.cxlii-p2.10"></a> </div> <div class="Commentary" id="x.xix.cxlii-p2.11"> <a name="x.xix.cxlii-p2.12"></a> </div> <div class="Commentary" id="x.xix.cxlii-p2.13"> <a name="x.xix.cxlii-p2.14"></a> </div> <div class="Commentary" id="x.xix.cxlii-p2.15"> <a name="x.xix.cxlii-p2.16"></a> </div> <div class="Commentary" id="x.xix.cxlii-p2.17"> <a name="x.xix.cxlii-p2.18"></a> </div> <div class="Commentary" id="x.xix.cxlii-p2.19"> </div> </div>
